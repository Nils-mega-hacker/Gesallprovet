        <main class="contact-main">
            <div class="sidebar">
                
                <h2>Contact me</h2>
                <p>Fill in this form and I'll be able to get back to you</p>
                <form id="contactForm">                    
                    <fieldset>
                        <legend>Your contact information</legend>
                        <div class="hp" aria-hidden="true">
                            <label for="company">Leave this field empty</label>
                            <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="fname">First name </label>
                            <input type="text" id="fname" name="fname" placeholder="John" 
                            pattern="[\p{L}\-' ]{2,}"
                            title="Enter a name with at least 2 letters"
                            required autocomplete="given-name">
                        </div>
                        <div class="form-group">
                            <label for="lname">Last name </label>
                            <input type="text" id="lname" name="lname" placeholder="Doe" 
                            pattern="[\p{L}\-' ]{2,}"
                            title="Enter a name with at least 2 letters"
                            required autocomplete="family-name">
                        </div>
                        <div class="form-group">
                            <label for="email">Mail address </label>
                            <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label for="website">Website </label>
                            <input type="url" id="website" name="website" list="siteSuggestions" placeholder="https://www.mycompany.com">
                            <datalist id="siteSuggestions">
                                <option value="https://github.com/">Github</option>
                                <option value="https://facebook.com/">Facebook</option>
                                <option value="https://x.com/">X</option>
                                <option value="https://linkedin.com/">Linkedin</option>
                            </datalist>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>Your message</legend>
                        <div class="form-group">
                            <label for="subject">Subject </label>
                            <select id="subject" name="subject">
                                <option value="job">Job</option>
                                <option value="internship">Internship</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message"></textarea>
                        </div>
                    </fieldset>
                    <div class="form-group-button">
                        <input type="reset">
                    </div>
                    <div class="form-group-button">
                        <input type="submit">
                    </div>
                    <p id="formStatus" role="status"></p>
                </form>

                <h2>Find me elsewhere</h2>
